<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1216;
    --panel: #1A1F26;
    --border: #2A313B;
    --cyan: #FF4655;
    --amber: #F5A524;
    --red: #F0574D;
    --text: #E6E9EE;
    --muted: #7A8494;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 10vh 20px 40px;
    position:relative;
  }

  #particleCanvas{
    position:fixed;
    inset:0;
    z-index:-3;
    pointer-events:none;
  }

  /* Wallpaper layer */
  #wallpaper{
    position:fixed;
    inset:0;
    z-index:-2;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  #wallpaper::after{
    content:"";
    position:absolute;
    inset:0;
    background: rgba(10,12,15,0.45);
  }
  body.has-wallpaper .search-console,
  body.has-wallpaper .stat{
    background: rgba(26,31,38,0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .clock, .date{ text-shadow: 0 1px 8px rgba(0,0,0,0.55); }

  /* Adaptive text for light wallpapers */
  body.light-wallpaper{
    --text: #1B2027;
    --muted: #4B5563;
  }
  body.light-wallpaper .clock,
  body.light-wallpaper .date{
    text-shadow: 0 1px 8px rgba(255,255,255,0.65);
  }
  body.light-wallpaper .search-console,
  body.light-wallpaper .stat,
  body.light-wallpaper .chat-panel,
  body.light-wallpaper .settings-menu,
  body.light-wallpaper .chat-toggle,
  body.light-wallpaper .settings-btn{
    background: rgba(255,255,255,0.65);
    border-color: rgba(0,0,0,0.14);
  }
  body.light-wallpaper .chat-msg.assistant{
    background: rgba(0,0,0,0.08);
  }
  body.light-wallpaper .search-console input::placeholder{ color: #6B7684; }

  /* Settings control */
  .settings-btn{
    position:fixed;
    top:18px;
    right:18px;
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:50%;
    color: var(--muted);
    cursor:pointer;
    font-size:16px;
    transition: color .15s ease, border-color .15s ease, transform .2s ease;
    z-index:10;
  }
  .settings-btn:hover{ color: var(--cyan); border-color: var(--cyan); transform: rotate(35deg); }

  .settings-menu{
    position:fixed;
    top:62px;
    right:18px;
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px;
    display:none;
    flex-direction:column;
    gap:4px;
    min-width:170px;
    z-index:10;
  }
  .settings-menu.open{ display:flex; }
  .settings-menu button{
    background:transparent;
    border:none;
    color: var(--text);
    font-family:'Inter', sans-serif;
    font-size:13px;
    text-align:left;
    padding:8px 10px;
    border-radius:7px;
    cursor:pointer;
  }
  .settings-menu button:hover{ background: var(--panel-hover, #232b36); color: var(--cyan); }
  .settings-menu button.danger:hover{ color: var(--red); }

  /* AI chat */
  .chat-toggle{
    position:fixed;
    bottom:20px;
    left:50%;
    transform: translateX(-50%);
    background: var(--panel);
    border:1px solid var(--border);
    color: var(--muted);
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:500;
    padding:10px 18px;
    border-radius:999px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition: border-color .15s ease, color .15s ease;
    z-index:10;
  }
  .chat-toggle:hover{ border-color: var(--cyan); color: var(--text); }
  .chat-toggle .dot{ width:6px; height:6px; border-radius:50%; background: var(--cyan); }

  .chat-panel{
    position:fixed;
    bottom:0;
    left:50%;
    transform: translateX(-50%);
    width:100%;
    max-width:560px;
    background: var(--panel);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:14px 14px 0 0;
    display:none;
    flex-direction:column;
    max-height:60vh;
    z-index:20;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.4);
  }
  .chat-panel.open{ display:flex; }

  .chat-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    border-bottom:1px solid var(--border);
  }
  .chat-head .title{
    font-family:'Chakra Petch', sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.04em;
  }
  .chat-head button{
    background:transparent;
    border:none;
    color: var(--muted);
    font-size:16px;
    cursor:pointer;
    line-height:1;
  }
  .chat-head button:hover{ color: var(--text); }

  .chat-messages{
    flex:1;
    overflow-y:auto;
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    font-size:13.5px;
  }
  .chat-msg{ max-width:85%; padding:9px 12px; border-radius:10px; line-height:1.4; white-space:pre-wrap; }
  .chat-msg.user{ align-self:flex-end; background: var(--cyan); color:#0F1216; }
  .chat-msg.assistant{ align-self:flex-start; background: #232A34; color: var(--text); }
  .chat-msg.system{ align-self:center; color: var(--muted); font-size:12px; }

  .chat-input-row{
    display:flex;
    gap:8px;
    padding:12px;
    border-top:1px solid var(--border);
  }
  .chat-input-row input{
    flex:1;
    background:#0F1216;
    border:1px solid var(--border);
    border-radius:8px;
    color: var(--text);
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    padding:10px 12px;
    outline:none;
  }
  .chat-input-row input:focus{ border-color: var(--cyan); }
  .chat-input-row button{
    background: var(--cyan);
    color:#0F1216;
    border:none;
    border-radius:8px;
    font-family:'Chakra Petch', sans-serif;
    font-weight:700;
    font-size:13px;
    padding:0 16px;
    cursor:pointer;
  }
  .chat-input-row button:disabled{ opacity:0.5; cursor:default; }

  .clock{
    font-family:'Chakra Petch', sans-serif;
    font-size:46px;
    font-weight:600;
    letter-spacing:0.02em;
  }
  .date{
    font-size:13px;
    color: var(--muted);
    margin-top:4px;
    margin-bottom:36px;
    letter-spacing:0.04em;
  }

  .search-wrap{ width:100%; max-width:560px; margin-bottom:28px; }
  .search-console{
    display:flex;
    align-items:center;
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding: 4px 6px 4px 16px;
    transition: border-color .15s ease;
  }
  .search-console:focus-within{ border-color: var(--cyan); }
  .search-console input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color: var(--text);
    font-family:'Inter', sans-serif;
    font-size:15px;
    padding:13px 0;
  }
  .search-console input::placeholder{ color: var(--muted); }
  .search-console button{
    background: var(--cyan);
    color:#0F1216;
    border:none;
    border-radius:7px;
    font-family:'Chakra Petch', sans-serif;
    font-weight:700;
    font-size:13px;
    padding: 10px 18px;
    cursor:pointer;
  }
  .search-console button:hover{ opacity:0.85; }

  .stats{
    width:100%;
    max-width:560px;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
  }
  .stat{
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .stat .label{
    font-size:10.5px;
    color: var(--muted);
    letter-spacing:0.1em;
    text-transform:uppercase;
  }
  .stat .value{
    font-family:'Chakra Petch', sans-serif;
    font-size:24px;
    font-weight:600;
  }
  .stat .value.good{ color: #4ADE80; }
  .stat .value.warn{ color: var(--amber); }
  .stat .value.bad{ color: var(--red); }
  .stat .sub{ font-size:10px; color: var(--muted); }
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>
<div id="wallpaper"></div>

<button class="settings-btn" id="settingsBtn" title="Settings">⚙</button>
<div class="settings-menu" id="settingsMenu">
  <button id="changeWallpaperBtn">Change wallpaper</button>
  <button id="removeWallpaperBtn" class="danger">Remove wallpaper</button>
  <button id="setApiKeyBtn">Set AI API key</button>
</div>
<input type="file" id="wallpaperInput" accept="image/*" style="display:none">

<button class="chat-toggle" id="chatToggle"><span class="dot"></span>Ask AI</button>
<div class="chat-panel" id="chatPanel">
  <div class="chat-head">
    <span class="title">AI ASSISTANT</span>
    <button id="chatClose">✕</button>
  </div>
  <div class="chat-messages" id="chatMessages">
    <div class="chat-msg system">Add your free Groq API key via the gear menu to start chatting.</div>
  </div>
  <div class="chat-input-row">
    <input type="text" id="chatInput" placeholder="Ask anything..." autocomplete="off">
    <button id="chatSend">Send</button>
  </div>
</div>

<div class="clock" id="clock">--:--</div>
<div class="date" id="date">loading</div>

<div class="search-wrap">
  <form class="search-console" id="searchForm">
    <input type="text" id="searchInput" placeholder="Search Brave..." autofocus autocomplete="off">
    <button type="submit">Search</button>
  </form>
</div>

<div class="stats">
  <div class="stat">
    <span class="label">Ping</span>
    <span class="value" id="pingValue">--</span>
    <span class="sub" id="pingSub">measuring</span>
  </div>
  <div class="stat">
    <span class="label">Refresh Rate</span>
    <span class="value" id="fpsValue">--</span>
    <span class="sub">Hz (est.)</span>
  </div>
  <div class="stat">
    <span class="label">Connection</span>
    <span class="value" id="statusValue">--</span>
    <span class="sub" id="statusSub">checking</span>
  </div>
</div>

<script>
  // Clock
  function tick(){
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock').textContent = `${h}:${m}`;
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('date').textContent =
      `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
  }
  tick();
  setInterval(tick, 1000);

  // Search
  document.getElementById('searchForm').addEventListener('submit', function(e){
    e.preventDefault();
    const q = document.getElementById('searchInput').value.trim();
    if(!q) return;
    window.open('https://search.brave.com/search?q=' + encodeURIComponent(q), '_blank');
  });

  // Ping test - measures round-trip time to a lightweight endpoint
  const pingEl = document.getElementById('pingValue');
  const pingSubEl = document.getElementById('pingSub');
  async function measurePing(){
    const start = performance.now();
    try{
      await fetch('https://www.gstatic.com/generate_204', { mode: 'no-cors', cache: 'no-store' });
      const ms = Math.round(performance.now() - start);
      pingEl.textContent = ms;
      pingEl.className = 'value ' + (ms < 60 ? 'good' : ms < 150 ? 'warn' : 'bad');
      pingSubEl.textContent = 'ms';
    }catch(err){
      pingEl.textContent = '--';
      pingEl.className = 'value bad';
      pingSubEl.textContent = 'unreachable';
    }
  }
  measurePing();
  setInterval(measurePing, 4000);

  // Refresh rate estimate via requestAnimationFrame sampling
  const fpsEl = document.getElementById('fpsValue');
  let frameCount = 0;
  let fpsWindowStart = performance.now();
  function fpsLoop(now){
    frameCount++;
    const elapsed = now - fpsWindowStart;
    if(elapsed >= 1000){
      fpsEl.textContent = Math.round((frameCount * 1000) / elapsed);
      frameCount = 0;
      fpsWindowStart = now;
    }
    requestAnimationFrame(fpsLoop);
  }
  requestAnimationFrame(fpsLoop);

  // Online/offline status
  const statusEl = document.getElementById('statusValue');
  const statusSubEl = document.getElementById('statusSub');
  function updateStatus(){
    const online = navigator.onLine;
    statusEl.textContent = online ? 'UP' : 'DOWN';
    statusEl.className = 'value ' + (online ? 'good' : 'bad');
    statusSubEl.textContent = online ? 'connected' : 'offline';
  }
  updateStatus();
  window.addEventListener('online', updateStatus);
  window.addEventListener('offline', updateStatus);

  // Custom wallpaper
  const wallpaperEl = document.getElementById('wallpaper');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsMenu = document.getElementById('settingsMenu');
  const wallpaperInput = document.getElementById('wallpaperInput');
  const changeWallpaperBtn = document.getElementById('changeWallpaperBtn');
  const removeWallpaperBtn = document.getElementById('removeWallpaperBtn');

  function applyWallpaper(dataUrl){
    if(dataUrl){
      wallpaperEl.style.backgroundImage = `url(${dataUrl})`;
      document.body.classList.add('has-wallpaper');
      detectBrightness(dataUrl);
    }else{
      wallpaperEl.style.backgroundImage = '';
      document.body.classList.remove('has-wallpaper');
      document.body.classList.remove('light-wallpaper');
    }
  }

  function detectBrightness(dataUrl){
    const img = new Image();
    img.onload = function(){
      const size = 40;
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const cctx = c.getContext('2d');
      cctx.drawImage(img, 0, 0, size, size);
      let pixels;
      try{ pixels = cctx.getImageData(0, 0, size, size).data; }
      catch(err){ return; } // can't read pixels, skip detection

      let total = 0;
      for(let i = 0; i < pixels.length; i += 4){
        total += 0.299 * pixels[i] + 0.587 * pixels[i + 1] + 0.114 * pixels[i + 2];
      }
      const avg = total / (pixels.length / 4);
      document.body.classList.toggle('light-wallpaper', avg > 150);
    };
    img.src = dataUrl;
  }

  // Load saved wallpaper on start
  try{
    const saved = localStorage.getItem('ntWallpaper');
    if(saved) applyWallpaper(saved);
  }catch(err){ /* localStorage unavailable */ }

  settingsBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    settingsMenu.classList.toggle('open');
  });
  document.addEventListener('click', (e)=>{
    if(!settingsMenu.contains(e.target) && e.target !== settingsBtn){
      settingsMenu.classList.remove('open');
    }
  });

  changeWallpaperBtn.addEventListener('click', ()=>{
    wallpaperInput.click();
    settingsMenu.classList.remove('open');
  });

  wallpaperInput.addEventListener('change', ()=>{
    const file = wallpaperInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      const dataUrl = e.target.result;
      applyWallpaper(dataUrl);
      try{ localStorage.setItem('ntWallpaper', dataUrl); }catch(err){ /* storage full or unavailable */ }
    };
    reader.readAsDataURL(file);
  });

  removeWallpaperBtn.addEventListener('click', ()=>{
    applyWallpaper(null);
    try{ localStorage.removeItem('ntWallpaper'); }catch(err){}
    settingsMenu.classList.remove('open');
  });

  // AI chat
  const chatToggle = document.getElementById('chatToggle');
  const chatPanel = document.getElementById('chatPanel');
  const chatClose = document.getElementById('chatClose');
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');
  const chatSend = document.getElementById('chatSend');
  const setApiKeyBtn = document.getElementById('setApiKeyBtn');

  let apiKey = null;
  try{ apiKey = localStorage.getItem('ntApiKey'); }catch(err){}

  let history = [];

  chatToggle.addEventListener('click', ()=>{
    chatPanel.classList.add('open');
    chatToggle.style.display = 'none';
    chatInput.focus();
  });
  chatClose.addEventListener('click', ()=>{
    chatPanel.classList.remove('open');
    chatToggle.style.display = 'flex';
    history = [];
    chatMessages.innerHTML = '<div class="chat-msg system">Chat cleared. Ask anything to start a new conversation.</div>';
  });

  setApiKeyBtn.addEventListener('click', ()=>{
    const key = prompt('Enter your free Groq API key (from console.groq.com/keys \u2014 no credit card needed).\nIt is stored only in this browser and sent directly to Groq\u2019s API.');
    if(key){
      apiKey = key.trim();
      try{ localStorage.setItem('ntApiKey', apiKey); }catch(err){}
      addMsg('system', 'API key saved. You can start chatting.');
    }
    settingsMenu.classList.remove('open');
  });

  function addMsg(role, text){
    const div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    div.textContent = text;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
  }

  async function sendMessage(){
    const text = chatInput.value.trim();
    if(!text) return;
    if(!apiKey){
      addMsg('system', 'Set your free API key first (gear icon \u2192 Set AI API key).');
      return;
    }
    addMsg('user', text);
    history.push({ role: 'user', content: text });
    chatInput.value = '';
    chatSend.disabled = true;
    const thinkingEl = addMsg('assistant', 'thinking...');

    try{
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'authorization': 'Bearer ' + apiKey
        },
        body: JSON.stringify({
          model: 'openai/gpt-oss-120b',
          messages: history
        })
      });
      const data = await res.json();
      if(data.error){
        thinkingEl.textContent = 'Error: ' + data.error.message;
        thinkingEl.classList.add('system');
      }else{
        const reply = data.choices?.[0]?.message?.content || '(no response)';
        thinkingEl.textContent = reply;
        history.push({ role: 'assistant', content: reply });
      }
    }catch(err){
      thinkingEl.textContent = 'Request failed: ' + err.message;
    }
    chatSend.disabled = false;
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  chatSend.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') sendMessage();
  });

  // Dynamic glowing particle background
  (function initParticles(){
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, points = [];
    const spacing = 42;
    const glowRadius = 130;
    const mouse = { x: -9999, y: -9999 };

    function resize(){
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      points = [];
      for(let x = spacing / 2; x < w; x += spacing){
        for(let y = spacing / 2; y < h; y += spacing){
          points.push({ x, y, jitter: Math.random() * Math.PI * 2 });
        }
      }
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', (e)=>{ mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mouseleave', ()=>{ mouse.x = -9999; mouse.y = -9999; });
    window.addEventListener('touchmove', (e)=>{
      if(e.touches[0]){ mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
    }, { passive: true });

    let t = 0;
    function draw(){
      t += 0.02;
      ctx.clearRect(0, 0, w, h);
      for(const p of points){
        const dx = p.x - mouse.x, dy = p.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const intensity = Math.max(0, 1 - dist / glowRadius);
        const ambient = 0.5 + Math.sin(t + p.jitter) * 0.15;
        const alpha = 0.08 * ambient + intensity * 0.9;
        const size = 1 + intensity * 2.8;

        ctx.beginPath();
        if(intensity > 0.04){
          ctx.shadowBlur = 14 * intensity;
          ctx.shadowColor = 'rgba(255,70,85,0.9)';
        }else{
          ctx.shadowBlur = 0;
        }
        ctx.fillStyle = `rgba(255,70,85,${alpha})`;
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    resize();
    draw();
  })();
</script>

</body>
</html>
