  input, textarea{ cursor: text; }

  #particleCanvas{
    position:fixed;
    inset:0;
    z-index:-3;
    pointer-events:none;
  }

  #wallpaper{
    position:fixed;
    inset:0;
    z-index:-2;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  #wallpaper::after{
    content:"";
    position:absolute;
    inset:0;
    background: rgba(10,12,15,0.45);
  }
  body.has-wallpaper .search-console,
  body.has-wallpaper .stat{
    background: rgba(26,31,38,0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .clock, .date{ text-shadow: 0 1px 8px rgba(0,0,0,0.55); }

  /* Adaptive text for light wallpapers */
  body.light-wallpaper{
    --text: #1B2027;
    --muted: #4B5563;
  }
  body.light-wallpaper .clock,
  body.light-wallpaper .date{
    text-shadow: 0 1px 8px rgba(255,255,255,0.65);
  }
  body.light-wallpaper .search-console,
  body.light-wallpaper .stat,
  body.light-wallpaper .chat-panel,
  body.light-wallpaper .settings-menu,
  body.light-wallpaper .chat-toggle,
  body.light-wallpaper .settings-btn{
    background: rgba(255,255,255,0.65);
    border-color: rgba(0,0,0,0.14);
  }
  body.light-wallpaper .chat-msg.assistant{
    background: rgba(0,0,0,0.08);
  }
  body.light-wallpaper .search-console input::placeholder{ color: #6B7684; }

  .clock{
    font-family:'Chakra Petch', sans-serif;
    font-size:46px;
    font-weight:600;
    letter-spacing:0.02em;
  }
  .date{
    font-size:13px;
    color: var(--muted);
    margin-top:4px;
    margin-bottom:36px;
    letter-spacing:0.04em;
  }

  .search-wrap{ width:100%; max-width:560px; margin-bottom:28px; }
  .search-console{
    display:flex;
    align-items:center;
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding: 4px 6px 4px 16px;
    transition: border-color .15s ease;
  }
  .search-console:focus-within{ border-color: var(--cyan); }
  .search-console input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color: var(--text);
    font-family:'Inter', sans-serif;
    font-size:15px;
    padding:13px 0;
  }
  .search-console input::placeholder{ color: var(--muted); }
  .search-console button{
    background: var(--cyan);
    color:#0F1216;
    border:none;
    border-radius:7px;
    font-family:'Chakra Petch', sans-serif;

  .stats{
    width:100%;
    max-width:560px;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
  }
  .stat{
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .stat .label{
    font-size:10.5px;
    color: var(--muted);
    letter-spacing:0.1em;
    text-transform:uppercase;
  }
  .stat .value{
    font-family:'Chakra Petch', sans-serif;
    font-size:24px;
    font-weight:600;
  }
  .stat .value.good{ color: #4ADE80; }
  .stat .value.warn{ color: var(--amber); }
  .stat .value.bad{ color: var(--red); }
  .stat .sub{ font-size:10px; color: var(--muted); }

    top:18px;
    right:18px;
    width:36px;

  .settings-menu{
    position:fixed;
    top:62px;
    right:18px;
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px;
    display:none;
    flex-direction:column;
    gap:4px;
    min-width:170px;
    z-index:10;
  }
  .settings-menu.open{ display:flex; }
  .settings-menu button{
    background:transparent;
    border:none;
    color: var(--text);
    font-family:'Inter', sans-serif;
    font-size:13px;
    text-align:left;

</div>
<input type="file" id="wallpaperInput" accept="image/*" style="display:none">

<button class="chat-toggle" id="chatToggle"><span class="dot"></span>Ask AI</button>
<div class="chat-panel" id="chatPanel">
  <div class="chat-head">
    <span class="title">AI ASSISTANT</span>
    <button id="chatClose">✕</button>
  </div>
  <div class="chat-messages" id="chatMessages">
    <div class="chat-msg system">Add your free Groq API key via the gear menu to start chatting.</div>
  </div>
  <div class="chat-input-row">
    <input type="text" id="chatInput" placeholder="Ask anything..." autocomplete="off">
    <button id="chatSend">Send</button>
  </div>
</div>

<div class="clock" id="clock">--:--</div>
<div class="date" id="date">loading</div>

<div class="search-wrap">
  <form class="search-console" id="searchForm">
    <input type="text" id="searchInput" placeholder="Search Brave..." autofocus autocomplete="off">
    <button type="submit">Search</button>
  </form>
</div>

<div class="stats">
  <div class="stat">
    <span class="label">Ping</span>
    <span class="value" id="pingValue">--</span>
    <span class="sub" id="pingSub">measuring</span>
  </div>
  <div class="stat">
    <span class="label">Refresh Rate</span>
    <span class="value" id="fpsValue">--</span>
    <span class="sub">Hz (est.)</span>
  </div>
  <div class="stat">
    <span class="label">Connection</span>
    <span class="value" id="statusValue">--</span>
    <span class="sub" id="statusSub">checking</span>
  </div>
</div>

<script>
  // Clock
  function tick(){
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock').textContent = `${h}:${m}`;
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('date').textContent =
      `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
  }
  tick();
  setInterval(tick, 1000);

  // Search
  document.getElementById('searchForm').addEventListener('submit', function(e){
    e.preventDefault();
    const q = document.getElementById('searchInput').value.trim();
    if(!q) return;
    window.open('https://search.brave.com/search?q=' + encodeURIComponent(q), '_blank');
  });

  // Ping test - measures round-trip time to a lightweight endpoint
  const pingEl = document.getElementById('pingValue');
  const pingSubEl = document.getElementById('pingSub');
  async function measurePing(){
    const start = performance.now();
    try{
      await fetch('https://www.gstatic.com/generate_204', { mode: 'no-cors', cache: 'no-store' });
      const ms = Math.round(performance.now() - start);
      pingEl.textContent = ms;
      pingEl.className = 'value ' + (ms < 60 ? 'good' : ms < 150 ? 'warn' : 'bad');
      pingSubEl.textContent = 'ms';
    }catch(err){
      pingEl.textContent = '--';
      pingEl.className = 'value bad';
      pingSubEl.textContent = 'unreachable';
    }
  }
  measurePing();
  setInterval(measurePing, 4000);

  // Refresh rate estimate via requestAnimationFrame sampling
  const fpsEl = document.getElementById('fpsValue');
  let frameCount = 0;
  let fpsWindowStart = performance.now();
  function fpsLoop(now){
    frameCount++;
    const elapsed = now - fpsWindowStart;
    if(elapsed >= 1000){
      fpsEl.textContent = Math.round((frameCount * 1000) / elapsed);
      frameCount = 0;
      fpsWindowStart = now;
    }
    requestAnimationFrame(fpsLoop);
  }
  requestAnimationFrame(fpsLoop);

  // Online/offline status
  const statusEl = document.getElementById('statusValue');
  const statusSubEl = document.getElementById('statusSub');
  function updateStatus(){
    const online = navigator.onLine;
    statusEl.textContent = online ? 'UP' : 'DOWN';
    statusEl.className = 'value ' + (online ? 'good' : 'bad');
    statusSubEl.textContent = online ? 'connected' : 'offline';
  }
  updateStatus();
  window.addEventListener('online', updateStatus);
  window.addEventListener('offline', updateStatus);

  // Custom wallpaper
  const wallpaperEl = document.getElementById('wallpaper');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsMenu = document.getElementById('settingsMenu');
  const wallpaperInput = document.getElementById('wallpaperInput');
  const changeWallpaperBtn = document.getElementById('changeWallpaperBtn');
  const removeWallpaperBtn = document.getElementById('removeWallpaperBtn');

  function applyWallpaper(dataUrl){
    if(dataUrl){
      wallpaperEl.style.backgroundImage = `url(${dataUrl})`;
      document.body.classList.add('has-wallpaper');
      detectBrightness(dataUrl);
    }else{
      wallpaperEl.style.backgroundImage = '';
      document.body.classList.remove('has-wallpaper');
      document.body.classList.remove('light-wallpaper');
    }
  }

  function detectBrightness(dataUrl){
    const img = new Image();
    img.onload = function(){
      const size = 40;
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const cctx = c.getContext('2d');
      cctx.drawImage(img, 0, 0, size, size);
      let pixels;
      try{ pixels = cctx.getImageData(0, 0, size, size).data; }
      catch(err){ return; }

      let total = 0;
      for(let i = 0; i < pixels.length; i += 4){
        total += 0.299 * pixels[i] + 0.587 * pixels[i + 1] + 0.114 * pixels[i + 2];
      }
      const avg = total / (pixels.length / 4);
      document.body.classList.toggle('light-wallpaper', avg > 150);
    };
    img.src = dataUrl;
  }

  try{
    const saved = localStorage.getItem('ntWallpaper');
    if(saved) applyWallpaper(saved);
  }catch(err){ /* localStorage unavailable */ }

  settingsBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    settingsMenu.classList.toggle('open');
  });
  document.addEventListener('click', (e)=>{
    if(!settingsMenu.contains(e.target) && e.target !== settingsBtn){
      settingsMenu.classList.remove('open');
    }
  });

  changeWallpaperBtn.addEventListener('click', ()=>{
    wallpaperInput.click();
    settingsMenu.classList.remove('open');
  });

  wallpaperInput.addEventListener('change', ()=>{
    const file = wallpaperInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      const dataUrl = e.target.result;
      applyWallpaper(dataUrl);
      try{ localStorage.setItem('ntWallpaper', dataUrl); }catch(err){ /* storage full or unavailable */ }
    };
    reader.readAsDataURL(file);
  });

  removeWallpaperBtn.addEventListener('click', ()=>{
    applyWallpaper(null);
    try{ localStorage.removeItem('ntWallpaper'); }catch(err){}
    settingsMenu.classList.remove('open');
  });

  // AI chat
  const chatToggle = document.getElementById('chatToggle');
  const chatPanel = document.getElementById('chatPanel');
  const chatClose = document.getElementById('chatClose');
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');
  const chatSend = document.getElementById('chatSend');
  const setApiKeyBtn = document.getElementById('setApiKeyBtn');

  let apiKey = null;
  try{ apiKey = localStorage.getItem('ntApiKey'); }catch(err){}

  let history = [];

  chatToggle.addEventListener('click', ()=>{
    chatPanel.classList.add('open');
    chatToggle.style.display = 'none';
    chatInput.focus();
  });
  chatClose.addEventListener('click', ()=>{
    chatPanel.classList.remove('open');
    chatToggle.style.display = 'flex';
    history = [];
    chatMessages.innerHTML = '<div class="chat-msg system">Chat cleared. Ask anything to start a new conversation.</div>';
  });

  setApiKeyBtn.addEventListener('click', ()=>{
    const key = prompt('Enter your free Groq API key (from console.groq.com/keys \u2014 no credit card needed).\nIt is stored only in this browser and sent directly to Groq\u2019s API.');
    if(key){
      apiKey = key.trim();
      try{ localStorage.setItem('ntApiKey', apiKey); }catch(err){}
      addMsg('system', 'API key saved. You can start chatting.');
    }
    settingsMenu.classList.remove('open');
  });

  function addMsg(role, text){
    const div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    div.textContent = text;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
  }

  async function sendMessage(){
    const text = chatInput.value.trim();
    if(!text) return;
    if(!apiKey){
      addMsg('system', 'Set your free API key first (gear icon \u2192 Set AI API key).');
      return;
    }
    addMsg('user', text);
    history.push({ role: 'user', content: text });
    chatInput.value = '';
    chatSend.disabled = true;
    const thinkingEl = addMsg('assistant', 'thinking...');

    try{
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'authorization': 'Bearer ' + apiKey
        },
        body: JSON.stringify({
          model: 'openai/gpt-oss-120b',
          messages: history
        })
      });
      const data = await res.json();
      if(data.error){
        thinkingEl.textContent = 'Error: ' + data.error.message;
        thinkingEl.classList.add('system');
      }else{
        const reply = data.choices?.[0]?.message?.content || '(no response)';
        thinkingEl.textContent = reply;
        history.push({ role: 'assistant', content: reply });
      }
    }catch(err){
      thinkingEl.textContent = 'Request failed: ' + err.message;
    }
    chatSend.disabled = false;
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  chatSend.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') sendMessage();
  });

  // Dynamic glowing particle background
  (function initParticles(){
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, points = [];
    const spacing = 46;
    const glowRadius = 160;
    const linkRadius = 95;
    const mouse = { x: -9999, y: -9999 };
    let mx = -9999, my = -9999;

    function getAccentRGB(){
      const probe = document.createElement('div');
      probe.style.color = 'var(--cyan)';
      probe.style.display = 'none';
      document.body.appendChild(probe);
      const rgb = getComputedStyle(probe).color.match(/\d+/g);
      document.body.removeChild(probe);
      return rgb ? rgb.slice(0, 3).join(',') : '229,56,59';
    }
    const accent = getAccentRGB();

    function resize(){
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      points = [];
      for(let x = spacing / 2; x < w; x += spacing){
        for(let y = spacing / 2; y < h; y += spacing){
          points.push({
            x, y,
            jitter: Math.random() * Math.PI * 2,
            ox: (Math.random() - 0.5) * 6,
            oy: (Math.random() - 0.5) * 6
          });
        }
      }
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', (e)=>{ mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mouseleave', ()=>{ mouse.x = -9999; mouse.y = -9999; });
    window.addEventListener('touchmove', (e)=>{
      if(e.touches[0]){ mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
    }, { passive: true });

    let t = 0;
    function draw(){
      t += 0.015;
      mx += (mouse.x - mx) * 0.12;
      my += (mouse.y - my) * 0.12;

      ctx.clearRect(0, 0, w, h);

      const near = [];
      for(const p of points){
        const dx = p.x - mx, dy = p.y - my;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if(dist < linkRadius) near.push({ p, dist });
      }
      for(let i = 0; i < near.length; i++){
        for(let j = i + 1; j < near.length; j++){
          const a = near[i].p, b = near[j].p;
          const dx = a.x - b.x, dy = a.y - b.y;
          const d = Math.sqrt(dx * dx + dy * dy);
          if(d < 60){
            const fade = (1 - d / 60) * (1 - near[i].dist / linkRadius) * (1 - near[j].dist / linkRadius);
            ctx.strokeStyle = `rgba(${accent},${fade * 0.5})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      for(const p of points){
        const drift = Math.sin(t + p.jitter);
        const px = p.x + p.ox * drift;
        const py = p.y + p.oy * Math.cos(t * 0.8 + p.jitter);

        const dx = px - mx, dy = py - my;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const intensity = Math.max(0, 1 - dist / glowRadius);
        const eased = intensity * intensity * (3 - 2 * intensity);
        const ambient = 0.55 + drift * 0.15;
        const size = 1 + eased * 3.2;
        const alpha = 0.09 * ambient + eased * 0.85;

        if(eased > 0.03){
          const glow = ctx.createRadialGradient(px, py, 0, px, py, size * 4);
          glow.addColorStop(0, `rgba(${accent},${alpha})`);
          glow.addColorStop(1, `rgba(${accent},0)`);
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(px, py, size * 4, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.beginPath();
        ctx.fillStyle = `rgba(${accent},${alpha})`;
        ctx.arc(px, py, size, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    resize();
    draw();
  })();
</script>

</body>
</html>
