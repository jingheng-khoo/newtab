<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1216;
    --panel: #1A1F26;
    --border: #2A313B;
    --cyan: #E5383B;
    --amber: #F5A524;
    --red: #F0574D;
    --text: #E6E9EE;
    --muted: #7A8494;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family:'Inter', sans-serif;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 6vh 20px 20px;
    position:relative;
    cursor: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNSIgaGVpZ2h0PSIxNSIgdmlld0JveD0iMCAwIDE1IDE1Ij48ZyBvcGFjaXR5PSIwLjc1Ij48ZyBmaWxsPSJibGFjayI+PHJlY3QgeD0iMCIgeT0iNiIgd2lkdGg9IjgiIGhlaWdodD0iMyIvPjxyZWN0IHg9IjciIHk9IjYiIHdpZHRoPSI4IiBoZWlnaHQ9IjMiLz48cmVjdCB4PSI2IiB5PSIwIiB3aWR0aD0iMyIgaGVpZ2h0PSI4Ii8+PHJlY3QgeD0iNiIgeT0iNyIgd2lkdGg9IjMiIGhlaWdodD0iOCIvPjwvZz48ZyBmaWxsPSJ3aGl0ZSI+PHJlY3QgeD0iMSIgeT0iNyIgd2lkdGg9IjYiIGhlaWdodD0iMSIvPjxyZWN0IHg9IjgiIHk9IjciIHdpZHRoPSI2IiBoZWlnaHQ9IjEiLz48cmVjdCB4PSI3IiB5PSIxIiB3aWR0aD0iMSIgaGVpZ2h0PSI2Ii8+PHJlY3QgeD0iNyIgeT0iOCIgd2lkdGg9IjEiIGhlaWdodD0iNiIvPjwvZz48L2c+PC9zdmc+") 7 7, auto;
  }
  input, textarea{
    cursor: text;
    caret-color: #ffffff;
    caret-shape: block;
  }
  .search-console input,
  .chat-input-row input{
    font-family: 'JetBrains Mono', 'Courier New', monospace;
  }

  #particleCanvas{
    position:fixed;
    inset:0;
    z-index:-3;
    pointer-events:none;
  }

  #wallpaper{
    position:fixed;
    inset:0;
    z-index:-2;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  #wallpaper::after{
    content:"";
    position:absolute;
    inset:0;
    background: rgba(10,12,15,0.45);
  }
  body.has-wallpaper .search-console,
  body.has-wallpaper .stat{
    background: rgba(26,31,38,0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .clock, .date{ text-shadow: 0 1px 8px rgba(0,0,0,0.55); }

  /* Adaptive text for light wallpapers */
  body.light-wallpaper{
    --text: #1B2027;
    --muted: #4B5563;
  }
  body.light-wallpaper .clock,
  body.light-wallpaper .date{
    text-shadow: 0 1px 8px rgba(255,255,255,0.65);
  }
  body.light-wallpaper .search-console,
  body.light-wallpaper .stat,
  body.light-wallpaper .chat-panel,
  body.light-wallpaper .settings-menu,
  body.light-wallpaper .chat-toggle,
  body.light-wallpaper .settings-btn,
  body.light-wallpaper .side-panel,
  body.light-wallpaper .side-toggle{
    background: rgba(255,255,255,0.65);
    border-color: rgba(0,0,0,0.14);
  }
  body.light-wallpaper .chat-msg.assistant{
    background: rgba(0,0,0,0.08);
  }
  body.light-wallpaper .calc-grid button{ background: transparent; }
  body.light-wallpaper .calc-grid button:hover{ background: rgba(0,0,0,0.08); }
  body.light-wallpaper #todoList li:hover{ background: rgba(0,0,0,0.08); }
  body.light-wallpaper .search-console input::placeholder{ color: #6B7684; }

  .clock{
    font-family:'Chakra Petch', sans-serif;
    font-size:46px;
    font-weight:600;
    letter-spacing:0.02em;
  }
  .date{
    font-size:13px;
    color: var(--muted);
    margin-top:4px;
    margin-bottom:36px;
    letter-spacing:0.04em;
  }

  .search-wrap{ width:100%; max-width:560px; margin-bottom:28px; }
  .search-console{
    display:flex;
    align-items:center;
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding: 4px 6px 4px 16px;
    transition: border-color .15s ease;
  }
  .search-console:focus-within{ border-color: var(--cyan); }
  .search-console input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color: var(--text);
    font-family:'Inter', sans-serif;
    font-size:15px;
    padding:13px 0;
  }
  .search-console input::placeholder{ color: var(--muted); }
  .search-console button{
    background: var(--cyan);
    color:#0F1216;
    border:none;
    border-radius:7px;
    font-family:'Chakra Petch', sans-serif;
    font-weight:700;
    font-size:13px;
    padding: 10px 18px;
    cursor: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNSIgaGVpZ2h0PSIxNSIgdmlld0JveD0iMCAwIDE1IDE1Ij48ZyBvcGFjaXR5PSIwLjc1Ij48ZyBmaWxsPSJibGFjayI+PHJlY3QgeD0iMCIgeT0iNiIgd2lkdGg9IjgiIGhlaWdodD0iMyIvPjxyZWN0IHg9IjciIHk9IjYiIHdpZHRoPSI4IiBoZWlnaHQ9IjMiLz48cmVjdCB4PSI2IiB5PSIwIiB3aWR0aD0iMyIgaGVpZ2h0PSI4Ii8+PHJlY3QgeD0iNiIgeT0iNyIgd2lkdGg9IjMiIGhlaWdodD0iOCIvPjwvZz48ZyBmaWxsPSJ3aGl0ZSI+PHJlY3QgeD0iMSIgeT0iNyIgd2lkdGg9IjYiIGhlaWdodD0iMSIvPjxyZWN0IHg9IjgiIHk9IjciIHdpZHRoPSI2IiBoZWlnaHQ9IjEiLz48cmVjdCB4PSI3IiB5PSIxIiB3aWR0aD0iMSIgaGVpZ2h0PSI2Ii8+PHJlY3QgeD0iNyIgeT0iOCIgd2lkdGg9IjEiIGhlaWdodD0iNiIvPjwvZz48L2c+PC9zdmc+") 7 7, auto;
  }
  .search-console button:hover{ opacity:0.85; }

  .stats{
    width:100%;
    max-width:560px;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
    margin-bottom:20px;
  }
  .stat{
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .stat .label{
    font-size:10.5px;
    color: var(--muted);
    letter-spacing:0.1em;
    text-transform:uppercase;
  }
  .stat .value{
    font-family:'Chakra Petch', sans-serif;
    font-size:24px;
    font-weight:600;
  }
  .stat .value.good{ color: #4ADE80; }
  .stat .value.warn{ color: var(--amber); }
  .stat .value.bad{ color: var(--red); }
  .stat .sub{ font-size:10px; color: var(--muted); }

  /* Settings control */
  .settings-btn{
    position:fixed;
    top:18px;
    right:18px;
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:50%;
    color: var(--muted);
    cursor: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNSIgaGVpZ2h0PSIxNSIgdmlld0JveD0iMCAwIDE1IDE1Ij48ZyBvcGFjaXR5PSIwLjc1Ij48ZyBmaWxsPSJibGFjayI+PHJlY3QgeD0iMCIgeT0iNiIgd2lkdGg9IjgiIGhlaWdodD0iMyIvPjxyZWN0IHg9IjciIHk9IjYiIHdpZHRoPSI4IiBoZWlnaHQ9IjMiLz48cmVjdCB4PSI2IiB5PSIwIiB3aWR0aD0iMyIgaGVpZ2h0PSI4Ii8+PHJlY3QgeD0iNiIgeT0iNyIgd2lkdGg9IjMiIGhlaWdodD0iOCIvPjwvZz48ZyBmaWxsPSJ3aGl0ZSI+PHJlY3QgeD0iMSIgeT0iNyIgd2lkdGg9IjYiIGhlaWdodD0iMSIvPjxyZWN0IHg9IjgiIHk9IjciIHdpZHRoPSI2IiBoZWlnaHQ9IjEiLz48cmVjdCB4PSI3IiB5PSIxIiB3aWR0aD0iMSIgaGVpZ2h0PSI2Ii8+PHJlY3QgeD0iNyIgeT0iOCIgd2lkdGg9IjEiIGhlaWdodD0iNiIvPjwvZz48L2c+PC9zdmc+") 7 7, auto;
    font-size:16px;
    transition: color .15s ease, border-color .15s ease, transform .2s ease;
    z-index:10;
  }
  .settings-btn:hover{ color: var(--cyan); border-color: var(--cyan); transform: rotate(35deg); }

  .settings-menu{
    position:fixed;
    top:62px;
    right:18px;
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px;
    display:none;
    flex-direction:column;
    gap:4px;
    min-width:170px;
    z-index:10;
  }
  .settings-menu.open{ display:flex; }
  .settings-menu button{
    background:transparent;
    border:none;
    color: var(--text);
    font-family:'Inter', sans-serif;
    font-size:13px;
    text-align:left;
    padding:8px 10px;
    border-radius:7px;
    cursor: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNSIgaGVpZ2h0PSIxNSIgdmlld0JveD0iMCAwIDE1IDE1Ij48ZyBvcGFjaXR5PSIwLjc1Ij48ZyBmaWxsPSJibGFjayI+PHJlY3QgeD0iMCIgeT0iNiIgd2lkdGg9IjgiIGhlaWdodD0iMyIvPjxyZWN0IHg9IjciIHk9IjYiIHdpZHRoPSI4IiBoZWlnaHQ9IjMiLz48cmVjdCB4PSI2IiB5PSIwIiB3aWR0aD0iMyIgaGVpZ2h0PSI4Ii8+PHJlY3QgeD0iNiIgeT0iNyIgd2lkdGg9IjMiIGhlaWdodD0iOCIvPjwvZz48ZyBmaWxsPSJ3aGl0ZSI+PHJlY3QgeD0iMSIgeT0iNyIgd2lkdGg9IjYiIGhlaWdodD0iMSIvPjxyZWN0IHg9IjgiIHk9IjciIHdpZHRoPSI2IiBoZWlnaHQ9IjEiLz48cmVjdCB4PSI3IiB5PSIxIiB3aWR0aD0iMSIgaGVpZ2h0PSI2Ii8+PHJlY3QgeD0iNyIgeT0iOCIgd2lkdGg9IjEiIGhlaWdodD0iNiIvPjwvZz48L2c+PC9zdmc+") 7 7, auto;
  }
  .settings-menu button:hover{ background:#232b36; color: var(--cyan); }
  .settings-menu button.danger:hover{ color: var(--red); }

  /* AI chat */
  /* Calculator + Todo side toggles */
  .side-toggle{
    position:fixed;
    bottom:20px;
    background: var(--panel);
    border:1px solid var(--border);
    color: var(--muted);
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:500;
    padding:10px 16px;
    border-radius:999px;
    cursor: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNSIgaGVpZ2h0PSIxNSIgdmlld0JveD0iMCAwIDE1IDE1Ij48ZyBvcGFjaXR5PSIwLjc1Ij48ZyBmaWxsPSJibGFjayI+PHJlY3QgeD0iMCIgeT0iNiIgd2lkdGg9IjgiIGhlaWdodD0iMyIvPjxyZWN0IHg9IjciIHk9IjYiIHdpZHRoPSI4IiBoZWlnaHQ9IjMiLz48cmVjdCB4PSI2IiB5PSIwIiB3aWR0aD0iMyIgaGVpZ2h0PSI4Ii8+PHJlY3QgeD0iNiIgeT0iNyIgd2lkdGg9IjMiIGhlaWdodD0iOCIvPjwvZz48ZyBmaWxsPSJ3aGl0ZSI+PHJlY3QgeD0iMSIgeT0iNyIgd2lkdGg9IjYiIGhlaWdodD0iMSIvPjxyZWN0IHg9IjgiIHk9IjciIHdpZHRoPSI2IiBoZWlnaHQ9IjEiLz48cmVjdCB4PSI3IiB5PSIxIiB3aWR0aD0iMSIgaGVpZ2h0PSI2Ii8+PHJlY3QgeD0iNyIgeT0iOCIgd2lkdGg9IjEiIGhlaWdodD0iNiIvPjwvZz48L2c+PC9zdmc+") 7 7, pointer;
    transition: border-color .15s ease, color .15s ease;
    z-index:10;
  }
  .side-toggle:hover{ border-color: var(--cyan); color: var(--text); }
  #calcToggle{ left:20px; }
  #todoToggle{ right:20px; }

  .side-panel{
    position:fixed;
    bottom:70px;
    width:260px;
    max-height:60vh;
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    display:none;
    flex-direction:column;
    z-index:20;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    overflow:hidden;
  }
  .side-panel.open{ display:flex; }
  #calcPanel{ left:20px; }
  #todoPanel{ right:20px; }

  .side-panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
    border-bottom:1px solid var(--border);
  }
  .side-panel-head .title{
    font-family:'Chakra Petch', sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
  }
  .side-panel-head button{
    background:transparent;
    border:none;
    color: var(--muted);
    font-size:15px;
    cursor: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNSIgaGVpZ2h0PSIxNSIgdmlld0JveD0iMCAwIDE1IDE1Ij48ZyBvcGFjaXR5PSIwLjc1Ij48ZyBmaWxsPSJibGFjayI+PHJlY3QgeD0iMCIgeT0iNiIgd2lkdGg9IjgiIGhlaWdodD0iMyIvPjxyZWN0IHg9IjciIHk9IjYiIHdpZHRoPSI4IiBoZWlnaHQ9IjMiLz48cmVjdCB4PSI2IiB5PSIwIiB3aWR0aD0iMyIgaGVpZ2h0PSI4Ii8+PHJlY3QgeD0iNiIgeT0iNyIgd2lkdGg9IjMiIGhlaWdodD0iOCIvPjwvZz48ZyBmaWxsPSJ3aGl0ZSI+PHJlY3QgeD0iMSIgeT0iNyIgd2lkdGg9IjYiIGhlaWdodD0iMSIvPjxyZWN0IHg9IjgiIHk9IjciIHdpZHRoPSI2IiBoZWlnaHQ9IjEiLz48cmVjdCB4PSI3IiB5PSIxIiB3aWR0aD0iMSIgaGVpZ2h0PSI2Ii8+PHJlY3QgeD0iNyIgeT0iOCIgd2lkdGg9IjEiIGhlaWdodD0iNiIvPjwvZz48L2c+PC9zdmc+") 7 7, pointer;
    line-height:1;
  }
  .side-panel-head button:hover{ color: var(--text); }

  #calcDisplay{
    padding:14px;
    text-align:right;
    font-family:'Chakra Petch', sans-serif;
    font-size:24px;
    font-weight:600;
    color: #E6E9EE;
    background:#0F1216;
    min-height:34px;
    overflow-x:auto;
    white-space:nowrap;
  }
  #calcExpr{
    padding:0 14px;
    text-align:right;
    font-size:11px;
    color: #7A8494;
    min-height:14px;
    background:#0F1216;
  }
  .calc-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:1px;
    background: var(--border);
    padding:1px;
  }
  .calc-grid button{
    background: var(--panel);
    border:none;
    color: var(--text);
    font-family:'Inter', sans-serif;
    font-size:13px;
    padding:11px 0;
    cursor: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNSIgaGVpZ2h0PSIxNSIgdmlld0JveD0iMCAwIDE1IDE1Ij48ZyBvcGFjaXR5PSIwLjc1Ij48ZyBmaWxsPSJibGFjayI+PHJlY3QgeD0iMCIgeT0iNiIgd2lkdGg9IjgiIGhlaWdodD0iMyIvPjxyZWN0IHg9IjciIHk9IjYiIHdpZHRoPSI4IiBoZWlnaHQ9IjMiLz48cmVjdCB4PSI2IiB5PSIwIiB3aWR0aD0iMyIgaGVpZ2h0PSI4Ii8+PHJlY3QgeD0iNiIgeT0iNyIgd2lkdGg9IjMiIGhlaWdodD0iOCIvPjwvZz48ZyBmaWxsPSJ3aGl0ZSI+PHJlY3QgeD0iMSIgeT0iNyIgd2lkdGg9IjYiIGhlaWdodD0iMSIvPjxyZWN0IHg9IjgiIHk9IjciIHdpZHRoPSI2IiBoZWlnaHQ9IjEiLz48cmVjdCB4PSI3IiB5PSIxIiB3aWR0aD0iMSIgaGVpZ2h0PSI2Ii8+PHJlY3QgeD0iNyIgeT0iOCIgd2lkdGg9IjEiIGhlaWdodD0iNiIvPjwvZz48L2c+PC9zdmc+") 7 7, pointer;
  }
  .calc-grid button:hover{ background:#232b36; }
  .calc-grid button.op{ color: var(--cyan); }
  .calc-grid button.eq{ background: var(--cyan); color:#0F1216; font-weight:700; }
  .calc-grid button.eq:hover{ opacity:0.85; background: var(--cyan); }
  .calc-grid button.wide{ grid-column: span 2; }

  .todo-input-row{
    display:flex;
    gap:6px;
    padding:10px;
    border-bottom:1px solid var(--border);
  }
  .todo-input-row input{
    flex:1;
    background:#0F1216;
    border:1px solid var(--border);
    border-radius:7px;
    color: var(--text);
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    padding:8px 10px;
    outline:none;
  }
  .todo-input-row input:focus{ border-color: var(--cyan); }
  .todo-input-row button{
    background: var(--cyan);
    color:#0F1216;
    border:none;
    border-radius:7px;
    font-family:'Chakra Petch', sans-serif;
    font-weight:700;
    font-size:12px;
    padding:0 12px;
    cursor: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNSIgaGVpZ2h0PSIxNSIgdmlld0JveD0iMCAwIDE1IDE1Ij48ZyBvcGFjaXR5PSIwLjc1Ij48ZyBmaWxsPSJibGFjayI+PHJlY3QgeD0iMCIgeT0iNiIgd2lkdGg9IjgiIGhlaWdodD0iMyIvPjxyZWN0IHg9IjciIHk9IjYiIHdpZHRoPSI4IiBoZWlnaHQ9IjMiLz48cmVjdCB4PSI2IiB5PSIwIiB3aWR0aD0iMyIgaGVpZ2h0PSI4Ii8+PHJlY3QgeD0iNiIgeT0iNyIgd2lkdGg9IjMiIGhlaWdodD0iOCIvPjwvZz48ZyBmaWxsPSJ3aGl0ZSI+PHJlY3QgeD0iMSIgeT0iNyIgd2lkdGg9IjYiIGhlaWdodD0iMSIvPjxyZWN0IHg9IjgiIHk9IjciIHdpZHRoPSI2IiBoZWlnaHQ9IjEiLz48cmVjdCB4PSI3IiB5PSIxIiB3aWR0aD0iMSIgaGVpZ2h0PSI2Ii8+PHJlY3QgeD0iNyIgeT0iOCIgd2lkdGg9IjEiIGhlaWdodD0iNiIvPjwvZz48L2c+PC9zdmc+") 7 7, pointer;
  }
  #todoList{
    list-style:none;
    overflow-y:auto;
    padding:6px;
  }
  #todoList li{
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 8px;
    border-radius:7px;
    font-size:12.5px;
  }
  #todoList li:hover{ background:#1F2530; }
  #todoList li input[type=checkbox]{
    accent-color: var(--cyan);

    font-weight:700;
    font-size:13px;
    padding:0 16px;
    cursor: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNSIgaGVpZ2h0PSIxNSIgdmlld0JveD0iMCAwIDE1IDE1Ij48ZyBvcGFjaXR5PSIwLjc1Ij48ZyBmaWxsPSJibGFjayI+PHJlY3QgeD0iMCIgeT0iNiIgd2lkdGg9IjgiIGhlaWdodD0iMyIvPjxyZWN0IHg9IjciIHk9IjYiIHdpZHRoPSI4IiBoZWlnaHQ9IjMiLz48cmVjdCB4PSI2IiB5PSIwIiB3aWR0aD0iMyIgaGVpZ2h0PSI4Ii8+PHJlY3QgeD0iNiIgeT0iNyIgd2lkdGg9IjMiIGhlaWdodD0iOCIvPjwvZz48ZyBmaWxsPSJ3aGl0ZSI+PHJlY3QgeD0iMSIgeT0iNyIgd2lkdGg9IjYiIGhlaWdodD0iMSIvPjxyZWN0IHg9IjgiIHk9IjciIHdpZHRoPSI2IiBoZWlnaHQ9IjEiLz48cmVjdCB4PSI3IiB5PSIxIiB3aWR0aD0iMSIgaGVpZ2h0PSI2Ii8+PHJlY3QgeD0iNyIgeT0iOCIgd2lkdGg9IjEiIGhlaWdodD0iNiIvPjwvZz48L2c+PC9zdmc+") 7 7, auto;

  /* ================= Animations ================= */

  @keyframes fadeSlideUp{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }

  @keyframes fadeSlideIn{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }

  @keyframes popIn{
    from{ opacity:0; transform: scale(0.9); }
    to{ opacity:1; transform: scale(1); }

  @keyframes valueFlash{
    0%{ text-shadow: 0 0 0 rgba(229,56,59,0); }

  /* Entrance animation for the main column, staggered */
  .clock{ animation: fadeSlideUp 0.5s ease both; }
  .date{ animation: fadeSlideUp 0.5s ease 0.05s both; }
  .stats{ animation: fadeSlideUp 0.5s ease 0.1s both; }
  .search-wrap{ animation: fadeSlideUp 0.5s ease 0.15s both; }

  /* Press feedback on every interactive control */
  .search-console button,
  .side-toggle,
  .settings-btn,
  .settings-menu button,
  .calc-grid button,
  .chat-input-row button,
  .chat-head button,
  .side-panel-head button,

  .search-console button:active,
  .side-toggle:active,
  .settings-btn:active,
  .settings-menu button:active,
  .calc-grid button:active,
  .chat-input-row button:active,

    transform: scale(0.93);

  .settings-menu.open{ animation: popIn 0.15s ease both; }
  .side-panel{ transform-origin: bottom; animation: none; }

  #todoList li.leaving{ opacity:0; transform: translateX(10px); max-height:0; padding-top:0; padding-bottom:0; overflow:hidden; }

  /* Gear icon spins a little further and snappier on open */

  /* Stat values flash briefly when they update */
  .stat .value.flash{ animation: valueFlash 0.6s ease; }

  /* Search button subtle pulse when a search actually fires */
  @keyframes searchPulse{
    0%{ box-shadow: 0 0 0 0 rgba(229,56,59,0.5); }
    100%{ box-shadow: 0 0 0 10px rgba(229,56,59,0); }
  }
  .search-console.pulse{ animation: searchPulse 0.5s ease-out; border-radius:10px; }

  /* Closing animations (reverse of the open ones) */
  @keyframes popOut{
    from{ opacity:1; transform: scale(1); }
    to{ opacity:0; transform: scale(0.9); }
  }
  @keyframes fadeSlideOut{
    from{ opacity:1; transform: translateY(0); }
    to{ opacity:0; transform: translateY(8px); }
  }
  .settings-menu.closing{ display:flex; animation: popOut 0.16s ease both; }
  .side-panel.closing{ display:flex; animation: fadeSlideOut 0.16s ease both; }

  /* Wallpaper cross-fades in instead of popping */
  #wallpaper{ opacity:0; transition: opacity 0.4s ease; }
  #wallpaper.loaded{ opacity:1; }

  /* Calculator flashes its display on a result */
  @keyframes calcFlash{
    0%{ background:#0F1216; }

  /* Search input shakes if you hit search with nothing typed */
  @keyframes shake{
    0%, 100%{ transform: translateX(0); }

    40%{ transform: translateX(5px); }
    60%{ transform: translateX(-4px); }

  }
  .search-console.shake{ animation: shake 0.35s ease; }

  /* Todo checkbox pops when checked */
  @keyframes checkPop{
    0%{ transform: scale(1); }
    40%{ transform: scale(1.35); }
    100%{ transform: scale(1); }
  }
  #todoList li input[type=checkbox].pop{ animation: checkPop 0.25s ease; }

  /* Ripple burst wherever the page background is clicked */
  @keyframes burstRipple{
    from{ opacity:0.6; transform: scale(0.4); }
    to{ opacity:0; transform: scale(1.6); }
  }
  .click-burst{
    position:fixed;
    width:36px; height:36px;
    border:2px solid var(--cyan);
    border-radius:50%;
    pointer-events:none;
    transform: translate(-50%,-50%);
    animation: burstRipple 0.5s ease-out forwards;
    z-index:5;
  }
</style>

<body>

<canvas id="particleCanvas"></canvas>
<div id="wallpaper"></div>

<button class="settings-btn" id="settingsBtn" title="Settings">⚙</button>

  </div>

  </div>

<script>
  // Clock
  function tick(){
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock').textContent = `${h}:${m}`;
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('date').textContent =
      `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
  }
  tick();
  setInterval(tick, 1000);

  // Search
  document.getElementById('searchForm').addEventListener('submit', function(e){
    e.preventDefault();
    const q = document.getElementById('searchInput').value.trim();
    const console_ = document.querySelector('.search-console');
    if(!q){
      console_.classList.remove('shake');
      void console_.offsetWidth;
      console_.classList.add('shake');
      return;
    }
    console_.classList.remove('pulse');
    void console_.offsetWidth; // restart animation
    console_.classList.add('pulse');
    window.open('https://search.brave.com/search?q=' + encodeURIComponent(q), '_blank');
  });

  // Brief highlight flash whenever a stat's displayed value actually changes
  function flashOnChange(el, newText){
    if(el.textContent !== String(newText)){
      el.textContent = newText;
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
    }
  }

  // Ping test - measures round-trip time to a lightweight endpoint
  const pingEl = document.getElementById('pingValue');
  const pingSubEl = document.getElementById('pingSub');
  async function measurePing(){
    const start = performance.now();
    try{
      await fetch('https://www.gstatic.com/generate_204', { mode: 'no-cors', cache: 'no-store' });
      const ms = Math.round(performance.now() - start);
      flashOnChange(pingEl, ms);
      pingEl.className = 'value ' + (ms < 60 ? 'good' : ms < 150 ? 'warn' : 'bad') + (pingEl.classList.contains('flash') ? ' flash' : '');
      pingSubEl.textContent = 'ms';
    }catch(err){
      pingEl.textContent = '--';
      pingEl.className = 'value bad';
      pingSubEl.textContent = 'unreachable';
    }
  }
  measurePing();
  setInterval(measurePing, 4000);

  // Refresh rate estimate via requestAnimationFrame sampling
  const fpsEl = document.getElementById('fpsValue');
  let frameCount = 0;
  let fpsWindowStart = performance.now();
  function fpsLoop(now){
    frameCount++;
    const elapsed = now - fpsWindowStart;
    if(elapsed >= 1000){
      flashOnChange(fpsEl, Math.round((frameCount * 1000) / elapsed));
      frameCount = 0;
      fpsWindowStart = now;
    }
    requestAnimationFrame(fpsLoop);
  }
  requestAnimationFrame(fpsLoop);

  // Online/offline status
  const statusEl = document.getElementById('statusValue');
  const statusSubEl = document.getElementById('statusSub');
  function updateStatus(){
    const online = navigator.onLine;
    flashOnChange(statusEl, online ? 'UP' : 'DOWN');
    statusEl.className = 'value ' + (online ? 'good' : 'bad') + (statusEl.classList.contains('flash') ? ' flash' : '');
    statusSubEl.textContent = online ? 'connected' : 'offline';
  }
  updateStatus();
  window.addEventListener('online', updateStatus);
  window.addEventListener('offline', updateStatus);

  // Custom wallpaper
  const wallpaperEl = document.getElementById('wallpaper');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsMenu = document.getElementById('settingsMenu');
  const wallpaperInput = document.getElementById('wallpaperInput');
  const changeWallpaperBtn = document.getElementById('changeWallpaperBtn');
  const removeWallpaperBtn = document.getElementById('removeWallpaperBtn');

  function applyWallpaper(dataUrl){
    if(dataUrl){
      wallpaperEl.classList.remove('loaded');
      wallpaperEl.style.backgroundImage = `url(${dataUrl})`;
      // wait a tick so the browser has the new image before fading it in
      requestAnimationFrame(()=> requestAnimationFrame(()=> wallpaperEl.classList.add('loaded')));
      document.body.classList.add('has-wallpaper');
      detectBrightness(dataUrl);
    }else{
      wallpaperEl.classList.remove('loaded');
      wallpaperEl.style.backgroundImage = '';
      document.body.classList.remove('has-wallpaper');
      document.body.classList.remove('light-wallpaper');
    }
  }

  function detectBrightness(dataUrl){
    const img = new Image();
    img.onload = function(){
      const size = 40;
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const cctx = c.getContext('2d');
      cctx.drawImage(img, 0, 0, size, size);
      let pixels;
      try{ pixels = cctx.getImageData(0, 0, size, size).data; }
      catch(err){ return; }

      let total = 0;
      for(let i = 0; i < pixels.length; i += 4){
        total += 0.299 * pixels[i] + 0.587 * pixels[i + 1] + 0.114 * pixels[i + 2];
      }
      const avg = total / (pixels.length / 4);
      document.body.classList.toggle('light-wallpaper', avg > 150);
    };
    img.src = dataUrl;
  }

  try{
    const saved = localStorage.getItem('ntWallpaper');
    if(saved) applyWallpaper(saved);
  }catch(err){ /* localStorage unavailable */ }

  // Helper: animate a display:none/flex toggle element out before hiding it
  function closeAnimated(el, closingClass){
    el.classList.add(closingClass);
    el.classList.remove('open');
    setTimeout(()=> el.classList.remove(closingClass), 160);
  }

  settingsBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    const opening = !settingsMenu.classList.contains('open');
    if(opening){
      settingsMenu.classList.remove('closing');
      settingsMenu.classList.add('open');
      settingsBtn.classList.remove('open');
      void settingsBtn.offsetWidth;
      settingsBtn.classList.add('open');
    }else{
      closeAnimated(settingsMenu, 'closing');
    }
  });
  document.addEventListener('click', (e)=>{
    if(!settingsMenu.contains(e.target) && e.target !== settingsBtn && settingsMenu.classList.contains('open')){
      closeAnimated(settingsMenu, 'closing');
    }
  });

  changeWallpaperBtn.addEventListener('click', ()=>{
    wallpaperInput.click();
    closeAnimated(settingsMenu, 'closing');
  });

  wallpaperInput.addEventListener('change', ()=>{
    const file = wallpaperInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      const dataUrl = e.target.result;
      applyWallpaper(dataUrl);
      try{ localStorage.setItem('ntWallpaper', dataUrl); }catch(err){ /* storage full or unavailable */ }
    };
    reader.readAsDataURL(file);
  });

  removeWallpaperBtn.addEventListener('click', ()=>{
    applyWallpaper(null);
    try{ localStorage.removeItem('ntWallpaper'); }catch(err){}
    closeAnimated(settingsMenu, 'closing');
  });

  // AI chat
  const chatPanel = document.getElementById('chatPanel');
  const chatClose = document.getElementById('chatClose');
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');
  const chatSend = document.getElementById('chatSend');
  const setApiKeyBtn = document.getElementById('setApiKeyBtn');

  let apiKey = null;
  try{ apiKey = localStorage.getItem('ntApiKey'); }catch(err){}

  let history = [];

  chatClose.addEventListener('click', ()=>{
    history = [];
    chatMessages.innerHTML = '<div class="chat-msg system">Chat cleared. Ask anything to start a new conversation.</div>';
  });

  setApiKeyBtn.addEventListener('click', ()=>{
    const key = prompt('Enter your free Groq API key (from console.groq.com/keys \u2014 no credit card needed).\nIt is stored only in this browser and sent directly to Groq\u2019s API.');
    if(key){
      apiKey = key.trim();
      try{ localStorage.setItem('ntApiKey', apiKey); }catch(err){}
      addMsg('system', 'API key saved. You can start chatting.');
    }
    settingsMenu.classList.remove('closing');
    closeAnimated(settingsMenu, 'closing');
  });

  function addMsg(role, text){
    const div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    div.textContent = text;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
  }

  function addThinkingMsg(){
    const div = document.createElement('div');
    div.className = 'chat-msg assistant';
    div.innerHTML = '<span class="thinking-dots"><span></span><span></span><span></span></span>';
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
  }

  async function sendMessage(){
    const text = chatInput.value.trim();
    if(!text) return;
    if(!apiKey){
      addMsg('system', 'Set your free API key first (gear icon \u2192 Set AI API key).');
      return;
    }
    addMsg('user', text);
    history.push({ role: 'user', content: text });
    chatInput.value = '';
    chatSend.disabled = true;
    const thinkingEl = addThinkingMsg();

    try{
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'authorization': 'Bearer ' + apiKey
        },
        body: JSON.stringify({
          model: 'openai/gpt-oss-120b',
          messages: history
        })
      });
      const data = await res.json();
      if(data.error){
        thinkingEl.textContent = 'Error: ' + data.error.message;
        thinkingEl.classList.add('system');
      }else{
        const reply = data.choices?.[0]?.message?.content || '(no response)';
        thinkingEl.textContent = reply;
        history.push({ role: 'assistant', content: reply });
      }
    }catch(err){
      thinkingEl.textContent = 'Request failed: ' + err.message;
    }
    chatSend.disabled = false;
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  chatSend.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') sendMessage();
  });

  // Dynamic glowing particle background
  (function initParticles(){
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, points = [];
    const spacing = 46;
    const glowRadius = 160;
    const linkRadius = 95;
    const mouse = { x: -9999, y: -9999 };
    let mx = -9999, my = -9999;

    function getAccentRGB(){
      const probe = document.createElement('div');
      probe.style.color = 'var(--cyan)';
      probe.style.display = 'none';
      document.body.appendChild(probe);
      const rgb = getComputedStyle(probe).color.match(/\d+/g);
      document.body.removeChild(probe);
      return rgb ? rgb.slice(0, 3).join(',') : '229,56,59';
    }
    const accent = getAccentRGB();

    function resize(){
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      points = [];
      for(let x = spacing / 2; x < w; x += spacing){
        for(let y = spacing / 2; y < h; y += spacing){
          points.push({
            x, y,
            jitter: Math.random() * Math.PI * 2,
            ox: (Math.random() - 0.5) * 6,
            oy: (Math.random() - 0.5) * 6
          });
        }
      }
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', (e)=>{ mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mouseleave', ()=>{ mouse.x = -9999; mouse.y = -9999; });
    window.addEventListener('touchmove', (e)=>{
      if(e.touches[0]){ mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
    }, { passive: true });

    let t = 0;
    function draw(){
      t += 0.015;
      mx += (mouse.x - mx) * 0.12;
      my += (mouse.y - my) * 0.12;

      ctx.clearRect(0, 0, w, h);

      const near = [];
      for(const p of points){
        const dx = p.x - mx, dy = p.y - my;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if(dist < linkRadius) near.push({ p, dist });
      }
      for(let i = 0; i < near.length; i++){
        for(let j = i + 1; j < near.length; j++){
          const a = near[i].p, b = near[j].p;
          const dx = a.x - b.x, dy = a.y - b.y;
          const d = Math.sqrt(dx * dx + dy * dy);
          if(d < 60){
            const fade = (1 - d / 60) * (1 - near[i].dist / linkRadius) * (1 - near[j].dist / linkRadius);
            ctx.strokeStyle = `rgba(${accent},${fade * 0.5})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      for(const p of points){
        const drift = Math.sin(t + p.jitter);
        const px = p.x + p.ox * drift;
        const py = p.y + p.oy * Math.cos(t * 0.8 + p.jitter);

        const dx = px - mx, dy = py - my;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const intensity = Math.max(0, 1 - dist / glowRadius);
        const eased = intensity * intensity * (3 - 2 * intensity);
        const ambient = 0.55 + drift * 0.15;
        const size = 1 + eased * 3.2;
        const alpha = 0.09 * ambient + eased * 0.85;

        if(eased > 0.03){
          const glow = ctx.createRadialGradient(px, py, 0, px, py, size * 4);
          glow.addColorStop(0, `rgba(${accent},${alpha})`);
          glow.addColorStop(1, `rgba(${accent},0)`);
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(px, py, size * 4, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.beginPath();
        ctx.fillStyle = `rgba(${accent},${alpha})`;
        ctx.arc(px, py, size, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    resize();
    draw();
  })();

  // A little ripple burst wherever the empty background is clicked
  document.addEventListener('click', (e)=>{
    const interactive = e.target.closest('button, input, a, .side-panel, .chat-panel, .settings-menu, .search-console');
    if(interactive) return;
    const burst = document.createElement('div');
    burst.className = 'click-burst';
    burst.style.left = e.clientX + 'px';
    burst.style.top = e.clientY + 'px';
    document.body.appendChild(burst);
    setTimeout(()=> burst.remove(), 500);
  });

  // Scientific calculator
  (function initCalculator(){
    const toggle = document.getElementById('calcToggle');
    const panel = document.getElementById('calcPanel');
    const closeBtn = document.getElementById('calcClose');
    const exprEl = document.getElementById('calcExpr');
    const displayEl = document.getElementById('calcDisplay');
    const clearBtn = document.getElementById('calcClear');
    const equalsBtn = document.getElementById('calcEquals');

    let expr = '';

    toggle.addEventListener('click', ()=>{
      if(panel.classList.contains('open')){
        panel.classList.add('closing');
        panel.classList.remove('open');
        setTimeout(()=> panel.classList.remove('closing'), 160);
      }else{
        panel.classList.remove('closing');
        panel.classList.add('open');
      }
    });
    closeBtn.addEventListener('click', ()=>{
      panel.classList.add('closing');
      panel.classList.remove('open');
      setTimeout(()=> panel.classList.remove('closing'), 160);
    });

    function render(){
      exprEl.textContent = expr;
      displayEl.textContent = expr === '' ? '0' : expr;
    }

    document.querySelectorAll('#calcPanel [data-val]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        expr += btn.dataset.val;
        render();
      });
    });
    document.querySelectorAll('#calcPanel [data-op]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        expr += btn.dataset.op;
        render();
      });
    });
    document.querySelectorAll('#calcPanel [data-fn]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const fn = btn.dataset.fn;
        if(fn === 'pi'){ expr += 'pi'; }
        else { expr += fn + '('; }
        render();
      });
    });

    clearBtn.addEventListener('click', ()=>{
      expr = '';
      exprEl.textContent = '';
      displayEl.textContent = '0';
    });

    equalsBtn.addEventListener('click', ()=>{
      if(!expr){ return; }
      try{
        // translate friendly names into Math.* calls, degrees for trig
        let safe = expr
          .replace(/\^/g, '**')
          .replace(/sin\(/g, 'Math.sin(rad(')
          .replace(/cos\(/g, 'Math.cos(rad(')
          .replace(/tan\(/g, 'Math.tan(rad(')
          .replace(/log\(/g, 'Math.log10(')
          .replace(/ln\(/g, 'Math.log(')
          .replace(/sqrt\(/g, 'Math.sqrt(')
          .replace(/pi/g, 'Math.PI');

        // close the extra paren opened by rad( for trig functions
        let openTrig = (expr.match(/sin\(|cos\(|tan\(/g) || []).length;
        safe = safe.replace(/Math\.(sin|cos|tan)\(rad\(([^()]*)\)/g, 'Math.$1(rad($2))');

        // only allow a safe character set before evaluating
        if(/[^0-9+\-*/().,\s\w]/.test(safe.replace(/Math\.\w+/g, '').replace(/rad/g, ''))){
          throw new Error('invalid characters');
        }

        const fn = new Function('rad', 'Math', `return (${safe});`);
        const result = fn((deg)=> deg * Math.PI / 180, Math);

        if(typeof result !== 'number' || !isFinite(result)){
          throw new Error('invalid result');
        }
        const rounded = Math.round(result * 1e10) / 1e10;
        exprEl.textContent = expr;
        displayEl.textContent = String(rounded);
        expr = String(rounded);
        displayEl.classList.remove('flash');
        void displayEl.offsetWidth;
        displayEl.classList.add('flash');
      }catch(err){
        displayEl.textContent = 'Error';
        expr = '';
      }
    });

    render();
  })();

  // To-do list
  (function initTodo(){
    const toggle = document.getElementById('todoToggle');
    const panel = document.getElementById('todoPanel');
    const closeBtn = document.getElementById('todoClose');
    const input = document.getElementById('todoInput');
    const addBtn = document.getElementById('todoAdd');
    const listEl = document.getElementById('todoList');

    let todos = [];
    try{
      const saved = localStorage.getItem('ntTodos');
      if(saved) todos = JSON.parse(saved);
    }catch(err){ todos = []; }

    function save(){
      try{ localStorage.setItem('ntTodos', JSON.stringify(todos)); }catch(err){}
    }

    function renderList(){
      listEl.innerHTML = '';
      if(todos.length === 0){
        const empty = document.createElement('div');
        empty.id = 'todoEmpty';
        empty.textContent = 'No tasks yet.';
        listEl.appendChild(empty);
        return;
      }
      todos.forEach((todo, i)=>{
        const li = document.createElement('li');
        if(todo.done) li.classList.add('done');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.addEventListener('change', ()=>{
          todos[i].done = checkbox.checked;
          li.classList.toggle('done', checkbox.checked);
          if(checkbox.checked){
            checkbox.classList.remove('pop');
            void checkbox.offsetWidth;
            checkbox.classList.add('pop');
          }
          save();
        });

        const span = document.createElement('span');
        span.textContent = todo.text;

        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.addEventListener('click', ()=>{
          li.classList.add('leaving');
          setTimeout(()=>{
            todos.splice(i, 1);
            save();
            renderList();
          }, 180);
        });

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(del);
        listEl.appendChild(li);
      });
    }

    function addTodo(){
      const text = input.value.trim();
      if(!text) return;
      todos.push({ text, done: false });
      input.value = '';
      save();
      renderList();
    }

    toggle.addEventListener('click', ()=>{
      if(panel.classList.contains('open')){
        panel.classList.add('closing');
        panel.classList.remove('open');
        setTimeout(()=> panel.classList.remove('closing'), 160);
      }else{
        panel.classList.remove('closing');
        panel.classList.add('open');
      }
    });
    closeBtn.addEventListener('click', ()=>{
      panel.classList.add('closing');
      panel.classList.remove('open');
      setTimeout(()=> panel.classList.remove('closing'), 160);
    });
    addBtn.addEventListener('click', addTodo);
    input.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter') addTodo();
    });

    renderList();
  })();
</script>
